<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Water Drop Game</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="game-wrapper">
        <h1 class="game-title">Water Drop 💧</h1>
        <p class="game-tagline">
            Catch the clean drops, avoid the dirty ones!
        </p>

        <div class="score-panel">
            <div class="score">
                Score: <span id="score">0</span>
            </div>

            <div class="timer">
                Time: <span id="time">30</span>s
            </div>

            <button id="start-btn">Start Game</button>
        </div>

        <div id="game-container">
            <div id="start-message">
                Press "Start Game" to begin!
            </div>
        </div>

        <p id="message" aria-live="polite">
            Collect clean water and avoid dirty water!
        </p>

        <div class="instructions">
            <p><span class="blue-key"></span> Clean water: +1 point</p>
            <p><span class="brown-key"></span> Dirty water: -2 points</p>
            <p>Reach 15 points to win!</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
